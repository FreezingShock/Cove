<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Inlet link preview card</title>
  <link rel="stylesheet" href="../../website/css/tokens.css">
  <style>
    /* Render-only page for capture.cjs. Not deployed. */
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body {
      background:
        radial-gradient(520px 420px at 14% 92%, var(--glow-a), transparent 70%),
        radial-gradient(480px 400px at 92% 6%, var(--glow-b), transparent 70%),
        linear-gradient(180deg, var(--base-2), var(--base));
      color: var(--text);
      font-family: Inter, -apple-system, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      position: relative;
      height: 630px;
      display: grid;
      grid-template-columns: 1fr 500px;
      align-items: center;
      gap: 56px;
      padding: 0 72px 0 80px;
      box-sizing: border-box;
    }
    .brand { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 650; letter-spacing: -0.02em; }
    .brand img { width: 40px; height: 40px; border-radius: 22.37%; }
    h1 {
      margin: 36px 0 0;
      font-size: 76px;
      line-height: 1;
      font-weight: 650;
      letter-spacing: -0.035em;
      text-wrap: balance;
    }
    p {
      margin: 26px 0 0;
      font-size: 26px;
      line-height: 1.4;
      color: var(--text-2);
      max-width: 30ch;
    }
    .keys { margin-top: 40px; display: flex; gap: 10px; align-items: center; font-size: 20px; color: var(--text-2); }
    kbd {
      font: inherit; font-size: 18px; font-weight: 600;
      min-width: 40px; height: 40px; display: inline-grid; place-items: center; padding: 0 12px;
      border-radius: 10px; background: var(--field); border: 1px solid var(--hair); color: var(--text);
      box-shadow: 0 2px 0 var(--hair);
    }
    .frame {
      position: relative;
      width: 500px;
      border-radius: 32px;
      overflow: hidden;
      border: 1px solid var(--hair);
      box-shadow: 0 40px 90px -30px rgba(0, 0, 0, .65);
    }
    .frame img { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <div class="card">
    <div>
      <div class="brand">
        <img src="../../website/assets/inlet-icon-light.svg" width="40" height="40" alt="">
        <span>Inlet</span>
      </div>
      <h1>Every app, one keystroke away.</h1>
      <p>A full-screen grid and search for your Mac. Your apps and files stay on your Mac.</p>
      <div class="keys"><kbd>⌥</kbd><kbd>Space</kbd><span>opens the grid</span></div>
    </div>
    <div class="frame">
      <img src="../../website/assets/launch/grid.webp" alt="">
    </div>
  </div>
</body>
</html>
