<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Inlet link preview card</title>
  <link rel="stylesheet" href="../../website/css/tokens.css">
  <link rel="stylesheet" href="../../website/css/brand.css">
  <style>
    /* Render-only page for capture.cjs. Not deployed. Cream, ink and one aqua tile. */
    @font-face { font-family: "Figtree"; src: url("../../website/fonts/figtree-latin-wght.woff2") format("woff2"); font-weight: 300 900; font-display: block; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body {
      background: var(--base);
      color: var(--text);
      font-family: Figtree, -apple-system, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card { position: relative; height: 630px; display: grid; grid-template-columns: 1fr 500px; align-items: center; gap: 56px; padding: 0 72px 0 80px; box-sizing: border-box; }
    .brand { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
    .brand img { width: 40px; height: 40px; border-radius: 22.37%; }
    h1 { margin: 36px 0 0; font-size: 76px; line-height: 1; font-weight: 700; letter-spacing: -0.035em; text-wrap: balance; }
    h1 .hl { background-size: 100% 0.32em; background-position: 0 90%; }
    p { margin: 26px 0 0; font-size: 26px; line-height: 1.4; color: var(--text-2); max-width: 30ch; }
    .keys { margin-top: 40px; display: flex; gap: 10px; align-items: center; font-size: 20px; color: var(--text-2); }
    kbd { font: inherit; font-size: 18px; font-weight: 600; min-width: 40px; height: 40px; display: inline-grid; place-items: center; padding: 0 12px; border-radius: 10px; background: var(--field); border: 1px solid var(--hair); color: var(--text); }
    .frame { position: relative; width: 500px; border-radius: 32px; overflow: hidden; box-shadow: 0 0 0 1px var(--hair), 0 40px 80px -36px rgba(23, 21, 15, .42); }
    .frame img { display: block; width: 100%; height: auto; }
    .tiles { position: absolute; left: 80px; top: 64px; display: grid; grid-template-columns: repeat(3, 12px); gap: 8px; }
    .tiles i { width: 12px; height: 12px; border-radius: 3px; background: var(--tile); }
    .tiles i.lit { background: var(--accent); }
    .band { position: absolute; left: 0; right: 0; bottom: 0; height: 52px; background: var(--text); color: var(--base); display: flex; align-items: center; gap: 26px; padding: 0 80px; font-size: 20px; font-weight: 650; letter-spacing: -0.01em; white-space: nowrap; }
    .band span + span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; background: var(--accent); margin-right: 26px; vertical-align: 1px; }
  </style>
</head>
<body>
  <div class="card">
    <div>
      <div class="brand">
        <img src="../../website/assets/inlet-icon-light.svg" width="40" height="40" alt="">
        <span>Inlet</span>
      </div>
      <h1>Every app, <span class="hl">one keystroke</span> away.</h1>
      <p>A full-screen grid and search for your Mac. Your apps and files stay on your Mac.</p>
      <div class="keys"><kbd>⌥</kbd><kbd>Space</kbd><span>opens the grid</span></div>
    </div>
    <div class="frame">
      <img src="../../website/assets/launch/grid.webp" alt="">
    </div>
  </div>
  <div class="band"><span>Open</span><span>Search</span><span>Arrange</span><span>Launch</span><span>Keep it on your Mac</span></div>
</body>
</html>
