<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inlet trailer scene</title>
<!--
  Render-only macOS desktop for scripts/launch-assets/capture.cjs. Not deployed.
  Everything is drawn here: wallpaper, menu bar, Dock, windows, cursor. No Apple wallpapers,
  icons or logos are used. renderAt(t) draws the video timeline at time t (seconds).
  renderPreset(name) draws a still.
-->
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; background: #0B0D0C; }
  #screen {
    position: absolute; inset: 0; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, Inter, "Helvetica Neue", Arial, sans-serif;
    color: #fff; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    font-feature-settings: "cv11" 1;
  }

  /* Wallpaper: an original ink gradient with one aqua glow (the brand accent) with soft light, plus fine grain. */
  #wall {
    position: absolute; inset: 0;
    background:
      radial-gradient(660px 480px at 14% 86%, rgba(70, 230, 214, .34), transparent 70%),
      radial-gradient(760px 540px at 88% 12%, rgba(244, 239, 230, .10), transparent 70%),
      radial-gradient(640px 460px at 64% 112%, rgba(70, 230, 214, .14), transparent 70%),
      linear-gradient(162deg, #0E1211 0%, #17201D 46%, #121614 100%);
  }
  #grain {
    position: absolute; inset: 0; opacity: .08; mix-blend-mode: overlay; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* Liquid-glass approximation: blurred, saturated backdrop, a rim highlight and a specular sheen. */
  .glass {
    position: relative;
    background: linear-gradient(160deg, rgba(255,255,255,.24), rgba(255,255,255,.07) 55%, rgba(255,255,255,.13));
    -webkit-backdrop-filter: blur(28px) saturate(175%);
    backdrop-filter: blur(28px) saturate(175%);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.26),
      inset 0 1.5px 0 rgba(255,255,255,.5),
      inset 0 -1px 0 rgba(0,0,0,.16),
      0 20px 50px rgba(0,0,0,.34);
  }
  .glass::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(115deg, transparent 38%, rgba(255,255,255,.2) 49%, transparent 60%);
  }

  /* Windows */
  .win {
    position: absolute; border-radius: 22px; overflow: hidden; background: #1E2026;
    box-shadow: 0 0 0 .6px rgba(0,0,0,.7), 0 3px 8px rgba(0,0,0,.28), 0 34px 80px rgba(0,0,0,.5);
  }
  .tb {
    position: relative; height: 46px; display: flex; align-items: center; padding: 0 16px;
    background: linear-gradient(#30333B, #262930); border-bottom: .5px solid rgba(0,0,0,.55);
  }
  .tl { width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.25); }
  .tl.r { background: #FF5F57; } .tl.y { background: #FEBC2E; } .tl.g { background: #28C840; }
  .ttl { position: absolute; left: 0; right: 0; text-align: center; font-size: 13px; font-weight: 600; color: rgba(255,255,255,.88); }

  #notes { left: 70px; top: 96px; width: 360px; height: 430px; }
  #notes .body { padding: 24px 26px; }
  #notes .h { width: 58%; height: 15px; border-radius: 5px; background: rgba(255,255,255,.34); margin-bottom: 22px; }
  #notes .ln { height: 9px; border-radius: 5px; background: rgba(255,255,255,.14); margin-bottom: 13px; }

  #photos { left: 290px; top: 110px; width: 700px; height: 500px; background: #1E2026; }
  #photos .split { display: flex; height: calc(100% - 46px); }
  #photos .side { width: 178px; padding: 12px 8px; background: rgba(255,255,255,.035); border-right: .5px solid rgba(0,0,0,.4); }
  #photos .si { height: 28px; line-height: 28px; padding: 0 10px; border-radius: 7px; font-size: 13px; color: rgba(255,255,255,.82); margin-bottom: 2px; }
  #photos .si.on { background: rgba(70, 230, 214, .42); color: #fff; }
  #photos .sh { font-size: 11px; font-weight: 600; color: rgba(255,255,255,.42); padding: 14px 10px 6px; }
  #photos .main { flex: 1; padding: 16px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; align-content: start; }
  #photos .th { position: relative; height: 112px; border-radius: 10px; overflow: hidden; }
  #photos .th::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 70% 30%, rgba(255,255,255,.28), transparent 42%); }

  /* Menu bar */
  #menubar {
    position: absolute; left: 0; right: 0; top: 0; height: 30px; z-index: 50;
    display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 14px;
    font-size: 13.5px; font-weight: 500; color: #fff;
    background: rgba(12, 16, 26, .30);
    -webkit-backdrop-filter: blur(24px) saturate(160%); backdrop-filter: blur(24px) saturate(160%);
    box-shadow: inset 0 -.5px 0 rgba(255,255,255,.12);
  }
  #menubar .l, #menubar .r { display: flex; align-items: center; gap: 16px; }
  #menubar .r { gap: 14px; }
  #menubar b { font-weight: 650; }
  #menubar .sys { display: flex; align-items: center; opacity: .95; }
  #menubar .clock { font-variant-numeric: tabular-nums; margin-left: 2px; }

  /* Dock */
  #dock {
    position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 25;
    display: flex; align-items: flex-end; gap: 10px; padding: 8px 12px 10px; border-radius: 26px;
  }
  .dk { position: relative; width: 58px; height: 58px; }
  .dk .dot { position: absolute; left: 50%; bottom: -10px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: rgba(255,255,255,.9); }

  /* App icons: a squircle with a gradient and a simple glyph. Original art. */
  .ic { position: relative; width: var(--s); height: var(--s); border-radius: calc(var(--s) * .2237); overflow: hidden;
        box-shadow: inset 0 0 0 .6px rgba(255,255,255,.34), inset 0 -2px 4px rgba(0,0,0,.12), 0 6px 14px rgba(0,0,0,.36); }
  .ic::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 50%; background: linear-gradient(rgba(255,255,255,.22), rgba(255,255,255,0)); }
  .ic svg { position: absolute; left: 16%; top: 16%; width: 68%; height: 68%; z-index: 1; }

  /* Overlay: Inlet grid over a dimmed desktop */
  #scrim {
    position: absolute; inset: 0; z-index: 40; background: rgba(6, 10, 18, .46);
    -webkit-backdrop-filter: blur(20px) saturate(115%); backdrop-filter: blur(20px) saturate(115%);
  }
  #overlay { position: absolute; inset: 0; z-index: 42; transform-origin: 640px 400px; }
  #bar {
    position: absolute; left: 390px; top: 58px; width: 500px; height: 48px; border-radius: 24px;
    display: flex; align-items: center; gap: 12px; padding: 0 18px; font-size: 18px;
  }
  #bar svg { width: 19px; height: 19px; flex: none; opacity: .75; }
  #qwrap { position: relative; height: 24px; flex: 1; }
  #qtext { position: absolute; left: 0; top: 0; white-space: pre; color: #fff; line-height: 24px; letter-spacing: -.005em; }
  #ph { position: absolute; left: 0; top: 0; color: rgba(255,255,255,.52); line-height: 24px; }
  #caret { position: absolute; top: 3px; width: 2px; height: 18px; background: #fff; border-radius: 1px; }

  #grid { position: absolute; left: 136px; top: 150px; display: grid; grid-template-columns: repeat(7, 144px); grid-auto-rows: 134px; }
  .tile { display: flex; flex-direction: column; align-items: center; padding-top: 12px; border-radius: 22px; }
  .tile .ic { --s: 72px; }
  .tile span { margin-top: 10px; font-size: 13px; font-weight: 500; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.5); white-space: nowrap; }
  .tile.hit { background: rgba(255,255,255,.1); }
  .tile.hit .ic { box-shadow: 0 0 0 3px rgba(70, 230, 214, .95), 0 0 26px rgba(70, 230, 214, .55), 0 6px 14px rgba(0,0,0,.36); }

  #files { position: absolute; left: 300px; top: 556px; width: 680px; border-radius: 22px; padding: 8px; }
  .frow { display: flex; align-items: center; height: 42px; padding: 0 12px; gap: 12px; border-radius: 14px; }
  .frow.hl { background: rgba(255,255,255,.12); }
  .frow .fi { width: 22px; height: 26px; flex: none; }
  .frow .fn { font-size: 15px; font-weight: 500; }
  .frow .fp { margin-left: auto; font-size: 13px; color: rgba(255,255,255,.55); }

  /* Quick panel (still only) */
  #quick {
    position: absolute; left: 454px; top: 150px; width: 372px; border-radius: 32px; padding: 16px; z-index: 43;
    display: flex; flex-direction: column; gap: 14px;
  }
  #quick .qs { height: 44px; border-radius: 22px; display: flex; align-items: center; gap: 10px; padding: 0 16px; font-size: 16px; color: rgba(255,255,255,.55); }
  #quick .qs svg { width: 17px; height: 17px; opacity: .7; }
  #quick .lab { font-size: 12px; font-weight: 600; color: rgba(255,255,255,.6); padding: 0 6px; margin-bottom: -6px; letter-spacing: .01em; }
  #quick .qg { display: grid; grid-template-columns: repeat(4, 1fr); row-gap: 8px; }
  #quick .qg .cell { display: flex; flex-direction: column; align-items: center; }
  #quick .qg .cell .ic { --s: 56px; }
  #quick .qg .cell span { margin-top: 7px; font-size: 12px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.45); white-space: nowrap; }
  #quick .qf .frow { height: 40px; }
  #quick .foot { display: flex; justify-content: center; }
  #quick .btn { height: 34px; padding: 0 18px; border-radius: 17px; display: flex; align-items: center; font-size: 13px; font-weight: 600; }

  /* Cursor and click ripple */
  #cursor { position: absolute; left: 0; top: 0; z-index: 60; width: 24px; height: 30px; filter: drop-shadow(0 2px 2.5px rgba(0,0,0,.5)); transform-origin: 2px 1px; }
  #ripple { position: absolute; left: 0; top: 0; z-index: 55; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; border: 2px solid rgba(255,255,255,.85); opacity: 0; }
</style>

    weather: '<circle cx="25" cy="25" r="9.5" fill="#FFD60A"/><path d="M21 49h23a7.5 7.5 0 0 0 0-15 11 11 0 0 0-20.5 3.2A6.5 6.5 0 0 0 21 49z" fill="#fff"/>',
    clock: '<circle cx="32" cy="32" r="20" fill="#fff"/><path d="M32 20v13l8.5 5" stroke="#1d1d1f" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
    calc: '<rect x="14" y="10" width="36" height="44" rx="6" fill="#FF9F0A"/><rect x="19" y="16" width="26" height="9" rx="2" fill="#fff"/><g fill="#fff"><circle cx="23" cy="34" r="2.7"/><circle cx="32" cy="34" r="2.7"/><circle cx="41" cy="34" r="2.7"/><circle cx="23" cy="43" r="2.7"/><circle cx="32" cy="43" r="2.7"/><circle cx="41" cy="43" r="2.7"/></g>',
    book: '<path d="M11 18c8-3 14-2 21 3 7-5 13-6 21-3v29c-8-3-14-2-21 3-7-5-13-6-21-3z" fill="#fff"/><path d="M32 21v29" stroke="#F0681E" stroke-width="2.6"/>',
    doc: '<path d="M18 11h19l10 10v32H18z" fill="#fff" stroke="#9AA6B6" stroke-width="2"/><path d="M37 11v10h10" fill="none" stroke="#9AA6B6" stroke-width="2"/><path d="M25 32h16M25 39h16M25 46h10" stroke="#8291A6" stroke-width="2.6" stroke-linecap="round"/>',
    mic: '<rect x="24.5" y="10" width="15" height="28" rx="7.5" fill="#fff"/><path d="M17 31a15 15 0 0 0 30 0M32 46v8" stroke="#fff" stroke-width="3.6" fill="none" stroke-linecap="round"/>',
    hammer: '<path d="M16 48L38 26" stroke="#fff" stroke-width="6.5" stroke-linecap="round"/><path d="M34 12l17 13-6 6-17-13z" fill="#fff"/>',
    folder: '<path d="M11 22a4 4 0 0 1 4-4h12l5 5h17a4 4 0 0 1 4 4v20a4 4 0 0 1-4 4H15a4 4 0 0 1-4-4z" fill="#fff"/>'
  };
  var FILE_ICON = '<svg viewBox="0 0 22 26" class="fi"><path d="M2 1.5h12l7 7v16H2z" fill="#fff" opacity=".92"/><path d="M14 1.5v7h7" fill="none" stroke="rgba(0,0,0,.25)" stroke-width="1"/><path d="M6 14h10M6 18h10M6 22h6" stroke="#6B7587" stroke-width="1.6" stroke-linecap="round"/></svg>';

  function iconHTML(app, size) {
    var g = GLYPH[app[1]];
    return '<div class="ic" style="--s:' + size + 'px;background:linear-gradient(160deg,' + app[2][0] + ',' + app[2][1] + ')">' +
      '<svg viewBox="0 0 64 64" aria-hidden="true">' + g + '</svg></div>';
  }
  function byName(n) { for (var i = 0; i < APPS.length; i++) if (APPS[i][0] === n) return APPS[i]; return null; }

  // ---- helpers ---------------------------------------------------------------
  function $(id) { return document.getElementById(id); }
  function clamp(x, a, b) { return Math.min(b, Math.max(a, x)); }
  function prog(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }
  function ease(x) { return 1 - Math.pow(1 - x, 3); }
  function easeInOut(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function easeOutBack(x) { var c1 = 1.45, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }

  // ---- build the DOM once ----------------------------------------------------
  function build() {
    var dock = $('dock');
    dock.className = 'glass';
    dock.innerHTML = DOCK.map(function (n) {
      var app = byName(n);
      return '<div class="dk">' + iconHTML(app, 58) + (n === 'Photos' ? '<i class="dot" id="dotPhotos" style="opacity:0"></i>' : '') + '</div>';
    }).join('');

    $('grid').innerHTML = APPS.map(function (app) {
      return '<div class="tile" data-name="' + app[0] + '">' + iconHTML(app, 72) + '<span>' + app[0] + '</span></div>';
    }).join('');

    $('thumbs').innerHTML = THUMBS.map(function (g) { return '<div class="th" style="background:' + g + '"></div>'; }).join('');

    var quickApps = APPS.slice(0, 8);
    $('quick').innerHTML =
      '<div class="qs glass"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>Search apps and files</div>' +
      '<div class="lab">Recent apps</div>' +
      '<div class="qg">' + quickApps.map(function (app) {
        return '<div class="cell">' + iconHTML(app, 56) + '<span>' + app[0] + '</span></div>';
      }).join('') + '</div>' +
      '<div class="lab">Recent files</div>' +
      '<div class="qf">' + QUICK_FILES.map(function (f, i) {
        return '<div class="frow' + (i === 0 ? ' hl' : '') + '">' + FILE_ICON + '<span class="fn">' + f[0] + '</span><span class="fp">' + f[1] + '</span></div>';
      }).join('') + '</div>' +
      '<div class="foot"><span class="btn glass">Show All Apps</span></div>';
  }

  var lastFilesKey = null;
  function filesFor(ql) {
    if (ql.indexOf('pho') === 0) return 'pho';
    if (ql.indexOf('note') === 0) return 'note';
    return null;
  }

  // ---- draw one state --------------------------------------------------------
  function render(s) {
    $('scrim').style.opacity = s.ov;
    var ov = $('overlay');
    ov.style.opacity = s.ov;
    ov.style.visibility = s.ov > 0.001 ? 'visible' : 'hidden';
    ov.style.transform = 'scale(' + s.ovS.toFixed(4) + ')';

    $('qtext').textContent = s.q;
    $('ph').style.display = s.q ? 'none' : '';
    $('caret').style.opacity = s.caret ? 1 : 0;
    $('caret').style.left = (s.q ? textWidth(s.q) : 0) + 'px';

    var ql = s.q.toLowerCase();
    var matches = ql ? APPS.filter(function (a) { return a[0].toLowerCase().indexOf(ql) !== -1; }).map(function (a) { return a[0]; }) : [];
    var hit = matches.length ? matches[0] : null;
    var tiles = document.querySelectorAll('.tile');
    for (var i = 0; i < tiles.length; i++) {
      var el = tiles[i], n = el.getAttribute('data-name');
      var isMatch = !ql || matches.indexOf(n) !== -1;
      el.style.opacity = isMatch ? 1 : (1 - 0.86 * s.dim).toFixed(3);
      el.classList.toggle('hit', n === hit);
      var icon = el.querySelector('.ic');
      var press = (n === hit) ? 1 - 0.07 * s.press : 1;
      icon.style.transform = 'scale(' + press.toFixed(4) + ')';
    }

    var key = filesFor(ql);
    var files = $('files');
    files.style.opacity = s.filesA;
    if (key !== lastFilesKey) {
      lastFilesKey = key;
      files.innerHTML = key ? FILES[key].map(function (f, idx) {
        return '<div class="frow' + (idx === 0 ? ' hl' : '') + '">' + FILE_ICON + '<span class="fn">' + f[0] + '</span><span class="fp">' + f[1] + '</span></div>';
      }).join('') : '';
    }

    var p = $('photos');
    p.style.opacity = s.photosOp;
    p.style.transform = 'scale(' + s.photosS.toFixed(4) + ')';
    $('sideRecents').classList.toggle('on', !!s.sideOn);
    $('dotPhotos').style.opacity = s.dotA;
    $('appname').textContent = s.appName;

    var q = $('quick');
    q.style.opacity = s.quick;
    q.style.visibility = s.quick > 0.001 ? 'visible' : 'hidden';

    var c = $('cursor');
    c.style.opacity = s.cur.a;
    c.style.transform = 'translate(' + (s.cur.x - 2.5).toFixed(2) + 'px,' + (s.cur.y - 1.5).toFixed(2) + 'px) scale(' + (1 - 0.1 * s.cur.press).toFixed(4) + ')';
    var r = $('ripple');
    r.style.opacity = s.rip > 0 ? (0.9 * (1 - s.rip)).toFixed(3) : 0;
    r.style.left = s.cur.x + 'px';
    r.style.top = s.cur.y + 'px';
    r.style.transform = 'scale(' + (0.2 + 1.1 * s.rip).toFixed(3) + ')';
  }

  // Width of the typed text, measured once per call with a hidden span.
  var measurer = null;
  function textWidth(str) {
    if (!measurer) {
      measurer = document.createElement('span');
      measurer.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;font-size:18px;letter-spacing:-.005em;font-family:inherit;';
      $('qtext').parentNode.appendChild(measurer);
    }
    measurer.textContent = str;
    return measurer.getBoundingClientRect().width;
  }

  // ---- video timeline ---------------------------------------------------------
  function cursorAt(t) {
    if (t <= CURSOR[0][0]) return { x: CURSOR[0][1], y: CURSOR[0][2] };
    for (var i = 0; i < CURSOR.length - 1; i++) {
      var a = CURSOR[i], b = CURSOR[i + 1];
      if (t >= a[0] && t <= b[0]) {
        var e = easeInOut((t - a[0]) / (b[0] - a[0]));
        return { x: a[1] + (b[1] - a[1]) * e, y: a[2] + (b[2] - a[2]) * e };
      }
    }
    var last = CURSOR[CURSOR.length - 1];
    return { x: last[1], y: last[2] };
  }

  function timeline(t) {
    var typed = '';
    K.keys.forEach(function (k) { if (t >= k[0]) typed += k[1]; });
    var openP = prog(t, K.open0, K.open1);
    var outP = prog(t, K.out0, K.out1);
    var ov = ease(openP) * (1 - easeInOut(outP));
    var ovS = (0.94 + 0.06 * easeOutBack(openP)) * (1 + 0.025 * outP);
    var firstKey = K.keys[0][0];
    var dim = typed ? ease(prog(t, firstKey, firstKey + 0.3)) : 0;
    var pr = prog(t, K.ret, K.ret + 0.35);
    var press = Math.sin(Math.PI * pr);
    var winP = prog(t, K.win0, K.win1);
    var pos = cursorAt(t);
    var clickP = prog(t, K.click, K.click + 0.5);
    return {
      ov: ov, ovS: ovS, q: typed, caret: ov > 0.6 && t < K.ret, dim: dim, press: press,
      filesA: typed.length >= 3 ? prog(t, K.keys[2][0] + 0.25, K.keys[2][0] + 0.6) : 0,
      photosOp: clamp(winP * 1.8, 0, 1), photosS: 0.92 + 0.08 * easeOutBack(winP),
      sideOn: t >= K.click + 0.1, dotA: prog(t, K.win1, K.win1 + 0.25),
      appName: t >= K.win0 + 0.1 ? 'Photos' : 'Finder', quick: 0,
      cur: { x: pos.x, y: pos.y, a: 1, press: Math.sin(Math.PI * prog(t, K.click, K.click + 0.2)) },
      rip: t >= K.click ? clickP : 0
    };
  }

  var BASE = {
    ov: 0, ovS: 1, q: '', caret: false, dim: 0, press: 0, filesA: 0, photosOp: 0, photosS: 1,
    sideOn: false, dotA: 0, appName: 'Finder', quick: 0, cur: { x: 0, y: 0, a: 0, press: 0 }, rip: 0
  };
  function preset(name) {
    var s = Object.assign({}, BASE);
    if (name === 'grid') { s.ov = 1; s.caret = true; }
    if (name === 'search') { s.ov = 1; s.q = 'note'; s.dim = 1; s.caret = true; s.filesA = 1; }
    if (name === 'quick') { s.quick = 1; }
    return s;
  }

  window.renderAt = function (t) { render(timeline(t)); };
  window.renderPreset = function (name) { render(preset(name)); };
  window.ready = false;
  build();
  // Set the caret position once the fonts are in, then mark the page ready.
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(function () {
    window.renderPreset('grid');
    window.ready = true;
  });
})();
</script>
</body>
</html>
