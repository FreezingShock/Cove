<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>README feature card (render-only)</title>
  <link rel="stylesheet" href="../../website/css/tokens.css">
  <link rel="stylesheet" href="../../website/css/brand.css">
  <style>
    /* Render-only template for build.cjs. Not deployed. Cream ground, ink type, one aqua highlight. */
    @font-face { font-family: "Figtree"; src: url("../../website/fonts/figtree-latin-wght.woff2") format("woff2"); font-weight: 300 900; font-display: block; }
    html, body { margin: 0; width: 2400px; height: 1350px; overflow: hidden; }
    body { background: var(--base); color: var(--text); font-family: Figtree, sans-serif; -webkit-font-smoothing: antialiased; position: relative; }
    .copy { position: absolute; left: 150px; top: 230px; width: 880px; }
    .eyebrow { display: flex; align-items: center; gap: 18px; font-size: 30px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-2); }
    .eyebrow::before { content: ""; width: 20px; height: 20px; border-radius: 5px; background: var(--accent); }
    h2 { margin: 44px 0 0; font-size: 116px; line-height: 1.02; font-weight: 700; letter-spacing: -0.04em; }
    p { margin: 56px 0 0; font-size: 42px; line-height: 1.42; color: var(--text-2); max-width: 22ch; text-wrap: pretty; }
    .hl { background: linear-gradient(var(--accent), var(--accent)) 0 88% / 100% 0.32em no-repeat; padding: 0 0.04em; }
    .frame { position: absolute; right: 120px; top: 230px; width: 1080px; border-radius: 56px; overflow: hidden; box-shadow: 0 0 0 2px var(--hair), 0 60px 120px -40px rgba(23, 21, 15, .45); }
    .frame img { display: block; width: 100%; height: auto; }
    .band { position: absolute; left: 0; right: 0; bottom: 0; height: 110px; background: var(--text); color: var(--base); display: flex; align-items: center; gap: 48px; padding: 0 150px; font-size: 40px; font-weight: 650; letter-spacing: -0.02em; white-space: nowrap; }
    .band span + span::before { content: ""; display: inline-block; width: 18px; height: 18px; border-radius: 4px; background: var(--accent); margin-right: 48px; vertical-align: 2px; }
  </style>
</head>
<body>
  <div class="copy">
    <div class="eyebrow" id="eyebrow">Grid</div>
    <h2 id="title">Every app, <span class="hl">on one page.</span></h2>
    <p id="body">Every app on your Mac, in one full-screen grid.</p>
  </div>
  <div class="frame"><img id="shot" src="" alt=""></div>
  <div class="band"><span>Open</span><span>Search</span><span>Arrange</span><span>Launch</span><span>Keep it on your Mac</span></div>
</body>
</html>
