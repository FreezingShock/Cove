name: Website

# Checks the landing page in website/ on every PR into integration, and
# publishes it to GitHub Pages when website/ changes on main.
#
# Previews: GitHub Pages hosts one site per repository, so a PR cannot get a
# live preview URL here. Instead, each run uploads the built site as a
# downloadable artifact named "inlet-website". Unzip it and open index.html.

on:
  pull_request:
    branches: [integration]
    paths:
      - "website/**"
      - "design/**"
      - "scripts/build-tokens.py"
      - "Inlet/InletTheme.swift"
      - "scripts/check-website.py"
      - "lighthouserc.json"
      - ".github/workflows/website.yml"
  push:
    branches: [integration, main]
    paths:
      - "website/**"
      - "design/**"
      - "scripts/build-tokens.py"
      - "Inlet/InletTheme.swift"
      - "scripts/check-website.py"
      - "lighthouserc.json"
      - ".github/workflows/website.yml"
  workflow_dispatch:
  # When a release finishes on main, redeploy the site so it shows the new version and size.
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

jobs:
  check:
    name: Check website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      present: ${{ steps.guard.outputs.present }}
    steps:
      - uses: actions/checkout@v4

      # Bootstrap guard: the site lands on integration through its own PR.
      # Until website/index.html is there, there is nothing to check or deploy.
      - name: Check for the website
        id: guard
        run: |
          if [ -f website/index.html ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No website/index.html on this branch yet, nothing to check."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.present == 'true'
        with:
          python-version: "3.12"

      # Fails on broken local links, missing #anchors, or any resource that
      # loads from another site (the page promises no external requests).
      - name: Check links, anchors and privacy
        if: steps.guard.outputs.present == 'true'
        run: python3 scripts/check-website.py website

      # The radius and motion blocks in tokens.css and InletTheme.swift are generated
      # from design/tokens.json. Fails if someone edited a block by hand or skipped the script.
      - name: Check generated radius and motion tokens
        run: python3 scripts/build-tokens.py --check

      - name: Upload preview artifact
        if: steps.guard.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: inlet-website
          path: website
          if-no-files-found: error
          retention-days: 14

  # Lighthouse on every page, desktop preset, median of three runs. The
  # assertions live in lighthouserc.json. Reports are uploaded as an artifact.
  lighthouse:
    name: Lighthouse
    needs: check
    if: needs.check.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.14.0 autorun --config=lighthouserc.json

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lighthouse-reports
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    # A push to main (nate's integration-to-main merge), a manual run from main, or a
    # finished Release on main publishes the site.
    if: >-
      needs.check.outputs.present == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    # Never cancel a half-finished deploy; let it complete, then run the next.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # enablement turns Pages on with the Actions source the first time.
      # If this step is refused, enable it once by hand:
      # Settings > Pages > Build and deployment > Source: GitHub Actions.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Stage a copy of the site and add release.json from the latest release, so the
      # page shows the current version and disk image size. Without a release, the page
      # keeps its built-in version and hides the size.
      - name: Stage the site with the latest release info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf _site
          cp -R website _site
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern release.json \
               --dir "$RUNNER_TEMP/release-info" --clobber 2>/dev/null; then
            cp "$RUNNER_TEMP/release-info/release.json" _site/release.json
            echo "Added release info:"; cat _site/release.json
          else
            echo "::notice::No release with release.json yet. The site keeps its built-in version."
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
