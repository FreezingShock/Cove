name: Release

# Runs when integration is merged into main. It builds Inlet in Release, packages
# it and publishes a GitHub Release tagged v<version>. It is safe to re-run: a
# version that already has a release is skipped.
#
# Builds are signed with the self-signed certificate in CODE_SIGN_P12 (see "Signing" in
# RELEASING.md). Developer ID signing and notarization are optional: they run only when the
# Apple secrets are set. With no signing secrets, the build stays ad-hoc signed.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and package only. Do not tag or publish.
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Read version and decide whether to release
        id: version
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ] && [ "$DRY_RUN" != "true" ]; then
            echo "::error::Releases publish from main only. Use dry_run to test another branch."
            exit 1
          fi
          if [ ! -f Inlet.xcodeproj/project.pbxproj ]; then
            echo "::error::Inlet.xcodeproj is not on this commit. Land PR #1 on integration first."
            exit 1
          fi

          OUT="$(python3 scripts/release/version.py current)"
          read -r VERSION BUILD <<< "$OUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD" >> "$GITHUB_OUTPUT"

          BUILD_IT=true
          PUBLISH=true
          if [ "$DRY_RUN" = "true" ]; then
            PUBLISH=false
          elif gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::notice::v$VERSION is already released, so there is nothing to do. Run Prepare release to bump the version."
            BUILD_IT=false
            PUBLISH=false
          fi
          echo "build=$BUILD_IT" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION (build $BUILD). Build: $BUILD_IT. Publish: $PUBLISH."

      - name: Select Xcode 26.6
        if: steps.version.outputs.build == 'true'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Set up code signing
        if: steps.version.outputs.build == 'true'
        env:
          CODE_SIGN_P12: ${{ secrets.CODE_SIGN_P12 }}
          CODE_SIGN_P12_PASSWORD: ${{ secrets.CODE_SIGN_P12_PASSWORD }}
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          # Three modes, picked from the secrets:
          #   developer-id  Developer ID certificate, then notarized. Optional. It needs a paid
          #                 Apple Developer account, which Inlet does not use.
          #   self-signed   The free self-signed certificate in CODE_SIGN_P12. This is the normal
          #                 release. It keeps one stable signing identity, so the privacy grants
          #                 macOS keeps for Inlet survive updates. It is not notarized.
          #   ad-hoc        No certificate. The identity changes with every build, and Gatekeeper
          #                 blocks the first launch.
          MODE=ad-hoc
          if [ -n "$MACOS_CERT_P12$APPLE_ID$APPLE_APP_PASSWORD" ]; then
            MISSING=""
            for name in MACOS_CERT_P12 MACOS_CERT_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
              if [ -z "${!name}" ]; then MISSING="$MISSING $name"; fi
            done
            if [ -n "$MISSING" ]; then
              echo "::error::Developer ID signing is partly set up. Add these secrets, or remove the rest:$MISSING"
              exit 1
            fi
            MODE=developer-id
          elif [ -n "$CODE_SIGN_P12" ]; then
            if [ -z "$CODE_SIGN_P12_PASSWORD" ]; then
              echo "::error::CODE_SIGN_P12 is set but CODE_SIGN_P12_PASSWORD is not."
              exit 1
            fi
            MODE=self-signed
          else
            echo "::warning::No signing secrets are set. Building ad-hoc signed. Run scripts/release/make-signing-certificate.sh and add CODE_SIGN_P12 to fix this."
          fi
          echo "SIGN_MODE=$MODE" >> "$GITHUB_ENV"
          echo "SIGNED=false" >> "$GITHUB_ENV"
          if [ "$MODE" = "ad-hoc" ]; then
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/inlet-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          P12="$RUNNER_TEMP/inlet-signing.p12"
          if [ "$MODE" = "developer-id" ]; then
            printf '%s' "$MACOS_CERT_P12" | base64 -d > "$P12"
            P12_PASSWORD="$MACOS_CERT_PASSWORD"
          else
            printf '%s' "$CODE_SIGN_P12" | base64 -d > "$P12"
            P12_PASSWORD="$CODE_SIGN_P12_PASSWORD"
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$P12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//')
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          if [ "$MODE" = "developer-id" ]; then
            IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
              | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -n 1)"
            if [ -z "$IDENTITY" ]; then
              echo "::error::MACOS_CERT_P12 has no Developer ID Application certificate with its private key."
              exit 1
            fi
            echo "Signing with: $IDENTITY"

            # Store the notary credentials in the temporary keychain. This keeps the
            # Apple ID password out of later commands.
            xcrun notarytool store-credentials inlet-notary \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --keychain "$KEYCHAIN" >/dev/null

            echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            # A self-signed certificate is not "valid" for trust purposes, so list
            # every code-signing identity, not only the trusted ones (-v).
            IDENTITY="$(security find-identity -p codesigning "$KEYCHAIN" \
              | sed -n 's/^[[:space:]]*[0-9]*) [0-9A-F]* "\(.*\)".*/\1/p' | head -n 1)"
            if [ -z "$IDENTITY" ]; then
              echo "::error::CODE_SIGN_P12 has no code-signing certificate with its private key."
              exit 1
            fi
            echo "Signing with the self-signed identity: $IDENTITY"
            echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          fi

      - name: Build Release
        if: steps.version.outputs.build == 'true'
        run: |
          SCHEME="$(xcodebuild -list -project Inlet.xcodeproj -json | jq -r '.project.schemes[0]')"
          echo "Using scheme: $SCHEME"
          case "${SIGN_MODE:-ad-hoc}" in
            developer-id)
              # Hardened runtime and a secure timestamp are both required for notarization.
              SIGNING_ARGS=(
                CODE_SIGN_STYLE=Manual
                CODE_SIGN_IDENTITY="$SIGN_IDENTITY"
                ENABLE_HARDENED_RUNTIME=YES
                OTHER_CODE_SIGN_FLAGS=--timestamp
                CODE_SIGNING_ALLOWED=YES
              )
              ;;
            self-signed)
              # Same identity on every build, so macOS keeps the grants it has for Inlet.
              # Hardened runtime stays off: a self-signed build can't be notarized, and
              # the hardened runtime's library checks would reject its Sparkle framework.
              SIGNING_ARGS=(
                CODE_SIGN_STYLE=Manual
                CODE_SIGN_IDENTITY="$SIGN_IDENTITY"
                ENABLE_HARDENED_RUNTIME=NO
                CODE_SIGNING_REQUIRED=YES
                CODE_SIGNING_ALLOWED=YES
              )
              ;;
            *)
              SIGNING_ARGS=(
                CODE_SIGN_IDENTITY=-
                CODE_SIGNING_REQUIRED=NO
                CODE_SIGNING_ALLOWED=YES
              )
              ;;
          esac
          xcodebuild build \
            -project Inlet.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            "${SIGNING_ARGS[@]}"

      - name: Check the built app's version
        if: steps.version.outputs.build == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build_number }}
        run: |
          APP="$(find build/DerivedData/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "::error::No .app found in build/DerivedData/Build/Products/Release."
            exit 1
          fi
          SHORT="$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")"
          BUNDLE="$(plutil -extract CFBundleVersion raw "$APP/Contents/Info.plist")"
          if [ "$SHORT" != "$VERSION" ] || [ "$BUNDLE" != "$BUILD" ]; then
            echo "::error::Built app reports $SHORT ($BUNDLE), expected $VERSION ($BUILD)."
            exit 1
          fi
          echo "Built app is $SHORT ($BUNDLE)."

      - name: Notarize and staple (when signed)
        if: steps.version.outputs.build == 'true'
        run: |
          if [ "${SIGNED:-false}" != "true" ]; then
            echo "::notice::Not a Developer ID build, so there is nothing to notarize."
            exit 0
          fi
          APP="$(find build/DerivedData/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"

          INFO="$(codesign -dv --verbose=4 "$APP" 2>&1)"
          if ! grep -q '^Authority=Developer ID Application' <<< "$INFO"; then
            echo "::error::$APP is not signed with a Developer ID Application certificate."
            exit 1
          fi

          # Notarization takes a zip. The stapled app is what package.sh zips next.
          SUBMIT_ZIP="$RUNNER_TEMP/Inlet-notary.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$SUBMIT_ZIP"

          echo "Submitting to Apple's notary service. This usually takes a few minutes."
          RESULT="$(xcrun notarytool submit "$SUBMIT_ZIP" \
            --keychain-profile inlet-notary --keychain "$KEYCHAIN" \
            --wait --output-format json)" || true
          echo "$RESULT"
          STATUS="$(jq -r '.status // "unknown"' <<< "$RESULT" 2>/dev/null || echo unknown)"
          SUBMISSION_ID="$(jq -r '.id // empty' <<< "$RESULT" 2>/dev/null || true)"
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization finished with status $STATUS."
            if [ -n "$SUBMISSION_ID" ]; then
              xcrun notarytool log "$SUBMISSION_ID" \
                --keychain-profile inlet-notary --keychain "$KEYCHAIN" || true
            fi
            exit 1
          fi

          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          echo "Notarized and stapled $(basename "$APP")."

      - name: Package zip and DMG
        if: steps.version.outputs.build == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APP="$(find build/DerivedData/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          scripts/release/package.sh "$APP" "$VERSION" build/release
          python3 scripts/release/changelog.py extract --version "$VERSION" > build/release/notes.md

      - name: Update Sparkle appcast (when the script exists)
        if: steps.version.outputs.build == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build_number }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -x scripts/release/update-appcast.sh ]; then
            scripts/release/update-appcast.sh "$VERSION" "$BUILD" "build/release/Inlet-$VERSION.zip" build/release
          else
            echo "::notice::scripts/release/update-appcast.sh is not on this commit, so no appcast.xml is attached."
          fi

      - name: Upload dry-run artifacts
        if: steps.version.outputs.build == 'true' && steps.version.outputs.publish == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: inlet-dry-run
          path: build/release/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ASSETS=(
            "build/release/Inlet-$VERSION.zip"
            "build/release/Inlet-$VERSION.dmg"
            "build/release/Inlet.dmg"
            "build/release/SHA256SUMS.txt"
          )
          if [ -f build/release/appcast.xml ]; then
            ASSETS+=("build/release/appcast.xml")
          fi
          gh release create "v$VERSION" "${ASSETS[@]}" \
            --target "$GITHUB_SHA" \
            --title "Inlet $VERSION" \
            --notes-file build/release/notes.md \
            --latest

      - name: Remove the signing keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ] && [ -f "$KEYCHAIN" ]; then
            security delete-keychain "$KEYCHAIN" || true
          fi
