name: CI

on:
  pull_request:
    branches: [integration]
  push:
    branches: [integration]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # macos-26 ships Xcode 26.6 (default) with the macOS 26.5 SDK.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Bootstrap guard: Cove.xcodeproj arrives with PR #1. Until it is on
      # integration there is nothing to build, so skip instead of failing.
      # TODO: remove this guard once PR #1 has landed.
      - name: Check for Xcode project
        id: guard
        run: |
          if [ -f Cove.xcodeproj/project.pbxproj ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No Cove.xcodeproj on this branch yet, nothing to build."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Select Xcode 26.6
        if: steps.guard.outputs.present == 'true'
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Show toolchain
        if: steps.guard.outputs.present == 'true'
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Resolve scheme
        id: scheme
        if: steps.guard.outputs.present == 'true'
        run: |
          SCHEME=$(xcodebuild -list -project Cove.xcodeproj -json | jq -r '.project.schemes[0]')
          echo "Using scheme: $SCHEME"
          echo "name=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.guard.outputs.present == 'true'
        run: |
          xcodebuild build \
            -project Cove.xcodeproj \
            -scheme "${{ steps.scheme.outputs.name }}" \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        if: steps.guard.outputs.present == 'true'
        run: |
          if grep -q 'com.apple.product-type.bundle.unit-test' Cove.xcodeproj/project.pbxproj; then
            xcodebuild test \
              -project Cove.xcodeproj \
              -scheme "${{ steps.scheme.outputs.name }}" \
              -destination 'platform=macOS' \
              CODE_SIGNING_ALLOWED=NO
          else
            echo "No unit test target yet, skipping tests."
          fi
