name: CI

on:
  pull_request:
    branches: [integration]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [integration]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# A new push to a PR (or a newer run on the same ref) cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides whether the macOS build is needed. Only changes to app code, the
  # project, workflows or scripts need it. Docs and website PRs skip it.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - name: Check which paths changed
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Default to building. Only skip when the compare call succeeds and
          # every changed file is outside the app paths.
          app=true
          if [ "$EVENT" = "pull_request" ] && files=$(gh api --paginate "repos/$REPO/compare/$BASE...$HEAD" --jq '.files[].filename'); then
            app=false
            while IFS= read -r f; do
              case "$f" in
                Inlet/*|Inlet.xcodeproj/*|.github/*|scripts/*) app=true; break ;;
              esac
            done <<< "$files"
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "Build needed: $app"

  # Keep the job id and name `build`: it is the required check on integration.
  # When skipped, the check reports as skipped, which counts as passing.
  build:
    needs: changes
    if: always() && needs.changes.outputs.app != 'false'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      SCHEME: Inlet
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Build
        run: |
          xcodebuild build \
            -project Inlet.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'platform=macOS' \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          if grep -q 'com.apple.product-type.bundle.unit-test' Inlet.xcodeproj/project.pbxproj; then
            xcodebuild test \
              -project Inlet.xcodeproj \
              -scheme "$SCHEME" \
              -destination 'platform=macOS' \
              CODE_SIGNING_ALLOWED=NO
          else
            echo "No unit test target yet, skipping tests."
          fi
